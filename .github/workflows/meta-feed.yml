name: Meta feed

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: meta-feed
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate feed
        run: python3 generate_meta_feed.py --out public
        env:
          SHOPIFY_ADMIN_TOKEN: ${{ secrets.SHOPIFY_ADMIN_TOKEN }}

      # Galaz gh-pages ma zawsze jeden commit, zeby historia repo nie puchla.
      - name: Publish to gh-pages
        working-directory: public
        run: |
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bopoco_meta_feed.csv bopoco_meta_feed.xml
          git commit -q -m "Update feed"
          git push -q --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # GitHub wylacza harmonogram po 60 dniach bez aktywnosci w publicznym repo.
      - name: Keep schedule enabled
        run: gh workflow enable meta-feed.yml --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
